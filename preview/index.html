<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Racha Vôlei — demonstração</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#f7faf8;background:#101a17}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#2d4a40,#101a17 45%);min-height:100vh}.app{width:min(100%,520px);margin:auto;min-height:100vh;background:#172521;padding:24px 22px 48px;box-shadow:0 0 80px #0008}.header{display:flex;align-items:center;margin:10px 0 48px}.ball{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:#d8ff63;color:#172521;font-size:25px;margin-right:11px}.brand{font-weight:950;line-height:18px;letter-spacing:1px}.brand span{display:block;color:#d8ff63}.status{margin-left:auto;padding:9px 12px;border-radius:20px;background:#22352f;color:#d3ded9;font-size:10px;font-weight:800;letter-spacing:1px}.status::before{content:'•';color:#d8ff63;font-size:20px;vertical-align:-2px;margin-right:5px}.eyebrow,.label{color:#d8ff63;font-size:11px;font-weight:900;letter-spacing:2px}.label{color:#91a19a}.title{font-size:32px;margin:8px 0 22px;letter-spacing:-1px}.entry{display:flex;gap:10px}.entry input{flex:1;background:#22352f;border:1px solid #30463f;border-radius:14px;padding:16px;color:white;font-size:16px}.add{width:54px;border:0;border-radius:14px;background:#d8ff63;font-size:27px}.row{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.count,.hint{color:#d8ff63;font-size:12px}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{display:flex;align-items:center;background:#22352f;border-radius:30px;padding:7px}.avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#344a42;color:#d8ff63;font-weight:900}.player span:nth-child(2){padding:0 9px;flex:1}.remove{border:0;background:none;color:#91a19a;font-size:19px;cursor:pointer}.formats{display:flex;gap:10px;margin-top:12px}.format{flex:1;padding:11px;border:1px solid #344a42;border-radius:14px;background:none;color:white;cursor:pointer}.format strong{display:block;font-size:22px}.format small{color:#91a19a;font-weight:900}.format.active{background:#d8ff63;color:#172521;border-color:#d8ff63}.format.active small{color:#172521}.hint{text-align:center;color:#91a19a}.primary{width:100%;margin-top:24px;padding:18px;border:0;border-radius:16px;background:#d8ff63;color:#172521;font-weight:950;letter-spacing:.5px;cursor:pointer}.score-sets,.teams{display:flex;gap:10px}.set,.team{flex:1;background:#22352f;border-radius:14px;padding:13px}.set{display:flex;justify-content:space-between;color:#91a19a;font-size:12px}.set b,.team b{color:#d8ff63}.board{display:flex;background:#22352f;border-radius:22px;margin-top:12px}.side{flex:1;text-align:center;padding:22px 8px}.side:first-child{border-right:1px solid #3a4d46}.side small{color:#91a19a;font-weight:900}.score{font-size:66px;font-weight:950;line-height:80px}.point{border:0;border-radius:12px;background:#d8ff63;padding:10px 15px;font-weight:900}.team{line-height:25px}.winner{text-align:center;color:#d8ff63;border:1px solid #d8ff63;border-radius:14px;padding:13px;margin-top:18px;font-weight:900}.back{text-align:center;color:#91a19a;text-decoration:underline;cursor:pointer;margin-top:18px}.hidden{display:none}@media(max-width:390px){.players{grid-template-columns:1fr}.app{padding-inline:16px}}
  </style>
</head>
<body><main class="app">
  <header class="header"><div class="ball">🏐</div><div class="brand">RACHA<span>VÔLEI</span></div><div class="status" id="status">PRONTO</div></header>
  <section id="setup"><div class="eyebrow">MONTE O SEU RACHA</div><h1 class="title">Jogadores de hoje</h1>
    <form class="entry" id="form"><input id="name" placeholder="Nome do jogador" autocomplete="off"><button class="add" aria-label="Adicionar">+</button></form>
    <div class="row"><span class="label">LISTA DE PRESENÇA</span><span class="count" id="count"></span></div><div class="players" id="players"></div>
    <div class="row"><span class="label">FORMATO DA PARTIDA</span></div><div class="formats" id="formats"><button class="format" data-value="1"><strong>1</strong><small>SET</small></button><button class="format" data-value="3"><strong>3</strong><small>SETS</small></button><button class="format active" data-value="5"><strong>5</strong><small>SETS</small></button></div>
    <p class="hint" id="rule">Melhor de 5 • último set até 15 pontos</p><button class="primary" id="draw">⇄ &nbsp; SORTEAR TIMES</button>
  </section>
  <section id="game" class="hidden"><div class="eyebrow">PLACAR DA PARTIDA</div><h1 class="title" id="set-title">Set 1 de 5</h1>
    <div class="score-sets"><div class="set">TIME A <b id="sets-a">0 sets</b></div><div class="set">TIME B <b id="sets-b">0 sets</b></div></div>
    <div class="board"><div class="side"><small>TIME A</small><div class="score" id="score-a">0</div><button class="point" data-team="a">＋ PONTO</button></div><div class="side"><small>TIME B</small><div class="score" id="score-b">0</div><button class="point" data-team="b">＋ PONTO</button></div></div>
    <p class="hint" id="target">Set até 25 • diferença mínima de 2 pontos</p><div class="teams"><div class="team"><b>TIME A</b><div id="team-a"></div></div><div class="team"><b>TIME B</b><div id="team-b"></div></div></div>
    <div class="winner hidden" id="winner"></div><button class="primary" id="finish">✓ &nbsp; ENCERRAR E SORTEAR NOVAMENTE</button><div class="back" id="back">Voltar à lista de jogadores</div>
  </section>
</main><script>
  let players=['André','Bruna','Caio','Dani','Edu','Fê','Gabi','Hugo','Isa','João','Lia','Marcos'],format=5,teams,score={a:0,b:0},sets={a:0,b:0},setNo=1;
  const $=id=>document.getElementById(id), shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  function renderPlayers(){$('count').textContent=`${players.length} jogadores`;$('players').innerHTML=players.map((p,i)=>`<div class="player"><span class="avatar">${p[0]}</span><span>${p}</span><button class="remove" data-i="${i}">×</button></div>`).join('')}
  function newTeams(){const mixed=shuffle(players);teams={a:mixed.filter((_,i)=>i%2===0),b:mixed.filter((_,i)=>i%2)};score={a:0,b:0};sets={a:0,b:0};setNo=1;renderGame()}
  function renderGame(){$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('status').textContent='EM JOGO';$('set-title').textContent=`Set ${setNo} de ${format}`;for(const t of ['a','b']){$(`score-${t}`).textContent=score[t];$(`sets-${t}`).textContent=`${sets[t]} sets`;$(`team-${t}`).innerHTML=teams[t].map(p=>`<div>• ${p}</div>`).join('')}const target=format>1&&setNo===format?15:25;$('target').textContent=`Set até ${target} • diferença mínima de 2 pontos`;const win=sets.a===Math.floor(format/2)+1?'A':sets.b===Math.floor(format/2)+1?'B':null;$('winner').classList.toggle('hidden',!win);$('winner').textContent=win?`🏆 Time ${win} venceu!`:''}
  $('form').onsubmit=e=>{e.preventDefault();const n=$('name').value.trim();if(n){players.push(n);$('name').value='';renderPlayers()}};$('players').onclick=e=>{if(e.target.dataset.i!==undefined){players.splice(+e.target.dataset.i,1);renderPlayers()}};
  $('formats').onclick=e=>{const b=e.target.closest('.format');if(!b)return;format=+b.dataset.value;document.querySelectorAll('.format').forEach(x=>x.classList.toggle('active',x===b));$('rule').textContent=format===1?'25 pontos, com 2 de vantagem':`Melhor de ${format} • último set até 15 pontos`};
  $('draw').onclick=()=>players.length>=2?newTeams():alert('Adicione pelo menos duas pessoas.');document.querySelectorAll('.point').forEach(b=>b.onclick=()=>{const t=b.dataset.team;if(sets.a===Math.floor(format/2)+1||sets.b===Math.floor(format/2)+1)return;score[t]++;const target=format>1&&setNo===format?15:25;if(score[t]>=target&&score[t]-score[t==='a'?'b':'a']>=2){sets[t]++;score={a:0,b:0};if(sets[t]<Math.floor(format/2)+1)setNo++}renderGame()});
  $('finish').onclick=()=>{if(confirm('Encerrar a partida e sortear novamente?')){players=[...teams.a,...teams.b];newTeams()}};$('back').onclick=()=>{$('game').classList.add('hidden');$('setup').classList.remove('hidden');$('status').textContent='PRONTO'};renderPlayers();
</script></body></html>
